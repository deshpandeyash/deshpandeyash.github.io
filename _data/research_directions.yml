- id: clock-synchronization
  number: "01"
  title: Clock synchronization
  short_summary: Uncertainty analysis, timestamping behavior, and distributed timing quality.
  eyebrow: "01 / Timing systems"
  intro: Clock synchronization remains a core theme in my work. I study how synchronization uncertainty can be quantified and across systems and network paths, with attention to timestamping, queueing, switch behavior, oscillator stability.
  detail: I spend a lot of effort in mathematically modeling clock synchronization protocols like PTP and NTP and verifying the models with measurements. The work has resulted in four publications, with more in progress and a patent pending.
  chips:
    - PTP
    - Timestamping
    - Oscillator drift
    - Uncertainty bounds
- id: deterministic-networking
  number: "02"
  title: Deterministic networking & latency modeling
  short_summary: Predictable communication, bounded latency, and timing-aware system design.
  eyebrow: "02 / Networking systems"
  intro: Related closely to my work on clock synchronization, I also model and measure latency and jitter in networked systems. 
  detail: Many factors affect the latency and jitter of networked systems, including scheduling policies, queueing behavior, and the interaction between network traffic. Similar to my work on clock synchronization, I build models and verify them with measurements. 
  chips:
    - Deterministic networking
    - Latency modeling
    - 5G
    - Performance analysis
- id: digital-twins
  number: "03"
  title: Digital twins
  short_summary: System representations for analysis, validation, and experimentation.
  eyebrow: "03 / Models & evaluation"
  intro: Accurate modeling of systems has also led me to explore Digital Twins - keeping live representations of systems that can be used for analysis, validation, and experimentation.
  detail: This direction connects naturally to system evaluation, what-if analysis, and the translation between observed behavior and the abstractions used to reason about it. The work also involved looking at cloud service behaviour, especially on Microsoft Azure.
  chips:
    - Digital twins
    - System models
    - Simulation
    - Cloud services
- id: tree-splitting-algorithms
  number: "04"
  title: Tree splitting algorithms
  short_summary: Algorithmic approaches to contention resolution and scalable coordination.
  eyebrow: "04 / Algorithms"
  intro: During my reasearch internship during my masters, I worked on the mathematically beautiful problem of tree splitting algorithms in contention resolution. 
  detail: I built models and simulations to investigate and validate the latency, fairness and efficiency of tree splitting algorithms in various contention scenarios. The work has resulted in various publications. 
  chips:
    - Tree splitting
    - Contention resolution
    - Distributed coordination
