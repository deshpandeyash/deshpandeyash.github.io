- id: deterministic-networking
  number: "01"
  title: Deterministic networking & latency modeling
  short_summary: Predictable communication, bounded latency, and timing-aware system design.
  eyebrow: "01 / Networking systems"
  intro: I am interested in how networks can provide predictable service under realistic operating conditions. This includes reasoning about latency bounds, scheduling effects, queueing behavior, and the interaction between deterministic communication mechanisms and heterogeneous systems such as 5G-connected deployments.
  detail: Latency modeling is central here—the goal is not only to measure delays, but to explain where they come from and how they compose across an end-to-end path.
  chips:
    - Deterministic networking
    - Latency modeling
    - 5G
    - Performance analysis
- id: clock-synchronization
  number: "02"
  title: Clock synchronization
  short_summary: Uncertainty analysis, timestamping behavior, and distributed timing quality.
  eyebrow: "02 / Timing systems"
  intro: Clock synchronization remains a core theme in my work. I study how synchronization uncertainty accumulates across systems and network paths, with attention to timestamping, queueing, switch behavior, oscillator stability, and model-based interpretation of timing measurements.
  detail: A recurring objective is to make timing quality measurable and explainable, especially in settings where systems need to make decisions based on imperfect time information.
  chips:
    - PTP
    - Timestamping
    - Oscillator drift
    - Uncertainty bounds
- id: digital-twins
  number: "03"
  title: Digital twins
  short_summary: System representations for analysis, validation, and experimentation.
  eyebrow: "03 / Models & evaluation"
  intro: I am interested in digital twins as a way to represent complex technical systems closely enough to support analysis, experimentation, and operational reasoning. In networking and distributed systems, that means combining measurements, models, and assumptions into artifacts that can be interrogated and validated.
  detail: This direction connects naturally to system evaluation, what-if analysis, and the translation between observed behavior and the abstractions used to reason about it.
  chips:
    - Digital twins
    - System models
    - Simulation
    - Validation
- id: tree-splitting-algorithms
  number: "04"
  title: Tree splitting algorithms
  short_summary: Algorithmic approaches to contention resolution and scalable coordination.
  eyebrow: "04 / Algorithms"
  intro: Tree splitting algorithms are interesting to me as a bridge between theory and systems behavior. They offer a structured way to resolve contention and study randomized coordination, especially when many participants compete for shared resources or access opportunities.
  detail: This line of work fits naturally with broader interests in performance modeling, distributed coordination, and scalable algorithm design.
  chips:
    - Tree splitting
    - Contention resolution
    - Randomized algorithms
    - Distributed coordination

