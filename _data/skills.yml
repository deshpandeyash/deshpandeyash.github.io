- id: mathematical-modelling
  number: "01"
  title: Mathematical modelling and Data analysis
  short_summary: Building mathematical models to analyze and predict network system behavior.
  eyebrow: "01 / Skills"
  intro: Over time and through various projects, I have developed expertise in constructing and analyzing mathematical models for networked systems.
  detail: For my work in clock synchronization and deterministic networking, I developed stochastic models using probability theory and stochastic and deterministic network calculus. During my work in tree-splitting algorithms, I worked on graph theory, probability theory and combinatorial analysis. All my work consisted of collecting experimental data and performing rigorous data analysis to validate the models.
  chips:
    - Stochastic models
    - Graph theory
    - Performance analysis
    - Delay analysis
  tools:
    - Python
    - MATLAB
    - NumPy
    - SciPy
